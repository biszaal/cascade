name: CascadeUITests
options:
  bundleIdPrefix: com.biszaal
  deploymentTarget:
    iOS: "16.4"
targets:
  CascadeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CascadeUITests]
    settings:
      base:
        # No host app: the tests drive the already-installed Cascade build by bundle id,
        # so this bundle can be built and run independently of Expo's generated project.
        TEST_TARGET_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.biszaal.CascadeUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  CascadeUITests:
    build:
      targets:
        CascadeUITests: [test]
    test:
      targets: [CascadeUITests]
